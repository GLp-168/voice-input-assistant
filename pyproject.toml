[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-input-assistant"
version = "0.1.0"
description = "Offline-first desktop voice input assistant with streaming ASR and a Qt WebEngine interface."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md", "UI-Flip-glass/LICENSE", "UI-Flip-glass/NOTICE.md", "UI-Flip-glass/UPSTREAM-NOTICE.md"]
authors = [
  { name = "Project Team" }
]
keywords = ["voice-input", "asr", "offline", "desktop"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "funasr>=1.3.14",
  "imageio-ffmpeg>=0.5.0",
  "modelscope>=1.37.0",
  "numpy>=1.24",
  "opencc-python-reimplemented>=0.1.7",
  "PySide6>=6.7,<7",
  "sounddevice>=0.4.6",
  "soundfile>=0.12,<0.14",
  "soxr>=1.0,<2",
  "torch>=2.0",
  "torchaudio>=2.0",
]

[project.optional-dependencies]
audio = [
  "numpy>=1.24",
  "sounddevice>=0.4.6",
]
clipboard = [
  "pyperclip>=1.8.2",
]
tray = [
  "pystray>=0.19",
  "Pillow>=10.0",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
voice-input = "voice_input.__main__:main"
voice-input-assistant = "voice_input.__main__:main"
voice-input-diagnose = "voice_input.diagnose_asr:main"
voice-input-eval = "voice_input.accuracy_eval:main"
voice-input-stream-eval = "voice_input.streaming_accuracy_eval:main"
voice-input-health = "voice_input.healthcheck:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["voice_input*"]

[tool.setuptools.package-data]
voice_input = [
  "web_dist/index.html",
  "web_dist/integrity.json",
  "web_dist/assets/*.css",
  "web_dist/assets/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
extend-exclude = [
  "build",
  "build-logs",
  "dist",
  "tmp",
  "vendor",
  "UI-Flip-glass",
  "src/voice_input.egg-info",
]
